<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>window.KD_ENC={"salt": "l2exp+ICiY91nHqBXMQWCQ==", "iter": 310000};</script>
<script src="enc.js"></script>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>버틀러 기업정보</title>
<style>
:root{color-scheme:dark light;font-family:system-ui,sans-serif;background:#10151e;color:#e5e9f1}
body{margin:0;min-height:100vh;display:grid;place-items:center}
main{max-width:30rem;padding:2rem;line-height:1.7}
h1{font-size:1.2rem}p{color:#aeb8c9}a{color:#8bbcff}
button{font:inherit;background:#253248;color:inherit;border:1px solid #455571;border-radius:6px;padding:.4rem .8rem;cursor:pointer}
nav{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>버틀러 기업정보</h1>
  <p id="status" role="status">버틀러 기업정보를 여는 중…</p>
  <nav id="actions" hidden>
    <button id="retry" type="button">다시 시도</button>
    <a id="fallback" hidden rel="noreferrer">네이버 증권으로 보기</a>
    <a href="index.html">대시보드</a>
  </nav>
  <noscript>기업정보를 열려면 브라우저의 자바스크립트를 켜주세요.</noscript>
</main>
<script>
// 버틀러는 종목코드와 별도의 DART 기업코드를 사용한다. 공식 검색 결과를 정확히 대조한다.
function butlerCompanyUrl(rows,code){
  if(!Array.isArray(rows))return null;
  const codes=new Set(rows.filter(r=>r&&r.stockCode===code&&r.country==="KR"&&r.category==="STOCK"&&r.isService===true&&/^\d{8}$/.test(r.corpCode)).map(r=>r.corpCode));
  if(codes.size!==1)return null;
  return `https://www.butler.works/ko/companies/${[...codes][0]}?corpMiddlePanel=dashboard`;
}
async function openButler(){
  const status=document.getElementById("status"),actions=document.getElementById("actions"),fallback=document.getElementById("fallback"),retry=document.getElementById("retry");
  actions.hidden=true;
  status.textContent="버틀러 기업정보를 여는 중…";
  const code=new URLSearchParams(location.search).get("code")||"";
  if(!/^[0-9A-Za-z]{6}$/.test(code)){
    status.textContent="종목코드를 확인할 수 없습니다. 대시보드에서 다시 선택해주세요.";
    retry.hidden=true;fallback.hidden=true;actions.hidden=false;return;
  }
  const mobile=navigator.userAgentData?.mobile||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  fallback.hidden=!!mobile;
  if(!mobile)fallback.href=`https://stock.naver.com/domestic/stock/${code}/`;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
  try{
    const response=await fetch(`https://api.butler.works/api/global/search?keyword=${encodeURIComponent(code)}`,{credentials:"omit",referrerPolicy:"no-referrer",signal:controller.signal});
    if(!response.ok)throw new Error("Search unavailable");
    const url=butlerCompanyUrl(await response.json(),code);
    if(url){location.replace(url);return}
    status.textContent="이 종목의 버틀러 기업정보를 찾을 수 없습니다.";
  }catch{
    status.textContent="버틀러에 연결하지 못했습니다. 잠시 후 다시 시도해주세요.";
  }finally{clearTimeout(timer)}
  actions.hidden=false;
}
document.getElementById("retry").onclick=openButler;
(async()=>{if(window.kdEncReady)await window.kdEncReady;await openButler()})();
</script>
</body>
</html>
